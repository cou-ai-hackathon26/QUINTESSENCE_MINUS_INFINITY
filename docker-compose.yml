version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: shongoti_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shongoti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
      POSTGRES_DB: ${POSTGRES_DB:-shongoti}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shongoti} -d ${POSTGRES_DB:-shongoti}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: shongoti_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-shongoti}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}@db:5432/${POSTGRES_DB:-shongoti}
      SECRET_KEY: ${SECRET_KEY:?Set a strong SECRET_KEY locally}
      ENVIRONMENT: production
      EVIDENCE_STORAGE_PATH: /app/storage/evidence
      VOICE_CACHE_PATH: /app/storage/voice
      SEMANTIC_MODEL_PATH: /app/storage/models/multilingual-e5-small
      SEMANTIC_ENABLED: ${SEMANTIC_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_TEXT_MODEL: ${GROQ_TEXT_MODEL:-openai/gpt-oss-120b}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-qwen/qwen3.8-27b}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - api_storage:/app/storage
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: shongoti_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres_data:
  api_storage:
