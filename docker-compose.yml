version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: shongoti_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shongoti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shongoti_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-shongoti}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shongoti} -d ${POSTGRES_DB:-shongoti}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: shongoti_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shongoti}:${POSTGRES_PASSWORD:-shongoti_secure_pass}@db:5432/${POSTGRES_DB:-shongoti}
      JWT_SECRET: ${JWT_SECRET:-production_jwt_secret_key_change_me_in_real_env}
      ENVIRONMENT: production
      STORAGE_PATH: /app/storage
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - api_storage:/app/storage
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: shongoti_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres_data:
  api_storage:
