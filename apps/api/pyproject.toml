[project]
name = "shongoti-api"
version = "0.1.0"
description = "Shongoti Backend API & Financial Domain Engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
    "pydantic>=2.10.2",
    "pydantic-settings>=2.6.1",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.17",
    "psycopg[binary]>=3.2.3",
    "pyjwt>=2.10.1",
    "bcrypt>=4.2.1",
    "pypdf>=5.1.0",
    "pymupdf>=1.26,<2",
    "fastembed>=0.9,<1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
