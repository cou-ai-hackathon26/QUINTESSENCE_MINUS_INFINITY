[project]
name = "shongoti-api"
version = "0.1.0"
description = "Shongoti Backend API & Financial Domain Engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165,<0.166",
    "starlette>=1.10,<1.11",
    "uvicorn[standard]>=0.32.1",
    "pydantic>=2.14.4,<3",
    "pydantic-settings>=2.16.3,<3",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "httpx>=0.28.0,<0.29",
    "python-multipart>=0.0.34,<0.1",
    "psycopg[binary]>=3.2.3",
    "pyjwt>=2.15.1,<3",
    "bcrypt>=4.2.1",
    "pymupdf>=1.26,<2",
    "fastembed>=0.9,<1",
    "edge-tts>=7.3.1,<8",
]

[project.optional-dependencies]
dev = ["pytest>=9.2,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
