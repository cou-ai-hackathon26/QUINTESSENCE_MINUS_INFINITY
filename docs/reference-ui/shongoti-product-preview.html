<div id="shongoti-product-preview" lang="bn">
  <div class="sg-preview-note">পণ্যের ইন্টারঅ্যাকটিভ প্রিভিউ · পর্দাভিত্তিক নমুনা তথ্য · কোনো real account সংযুক্ত নয়</div>
  <div class="sg-product">
    <header class="sg-top">
      <button class="sg-brand cursor-interaction" data-view="landing" aria-label="Shongoti landing page"><span class="sg-symbol">স</span><span>Shongoti<small>ব্যবসার টাকা, এক জায়গায়</small></span></button>
      <div class="sg-top-actions"><button class="sg-button sg-quiet cursor-interaction" data-view="home">ড্যাশবোর্ড দেখুন</button><button class="sg-button sg-primary cursor-interaction" data-view="login">শুরু করুন</button></div>
    </header>
    <div id="sg-layout"><nav id="sg-nav" aria-label="অ্যাপের মেনু" hidden></nav><main id="sg-content"></main></div>
    <div id="sg-message" class="sg-message" aria-live="polite" hidden></div>
  </div>
</div>
<style>
#shongoti-product-preview{--sg-bg:light-dark(#f7f9f8,#151d1a);--sg-surface:light-dark(#ffffff,#1c2722);--sg-text:light-dark(#172d25,#e9f4ed);--sg-secondary:light-dark(#52665c,#b2c5ba);--sg-border:light-dark(#dce6df,#364a3e);--sg-accent:light-dark(#14664e,#8ae0b5);--sg-on-accent:light-dark(#ffffff,#122b20);--sg-soft:light-dark(#e7f2eb,#243e30);--sg-risk:light-dark(#9b3d23,#ffc09f);--sg-risk-bg:light-dark(#fff1e8,#422d24);font:16px/1.65 "Nirmala UI","Noto Sans Bengali",system-ui,sans-serif;color:var(--sg-text);width:100%;color-scheme:light dark}
#shongoti-product-preview *{box-sizing:border-box}
#shongoti-product-preview [hidden]{display:none!important}
#shongoti-product-preview button,#shongoti-product-preview input,#shongoti-product-preview select,#shongoti-product-preview textarea{font:inherit}
#shongoti-product-preview button{color:inherit}
#shongoti-product-preview h1,#shongoti-product-preview h2,#shongoti-product-preview h3,#shongoti-product-preview p{margin:0}
#shongoti-product-preview h1{font-size:clamp(26px,4.2vw,44px);line-height:1.35;font-weight:600;letter-spacing:-.02em}
#shongoti-product-preview h2{font-size:24px;line-height:1.45;font-weight:600}
#shongoti-product-preview h3{font-size:17px;font-weight:600}
#shongoti-product-preview small,#shongoti-product-preview .sg-small{font-size:13px}
#shongoti-product-preview .sg-muted{color:var(--sg-secondary)}
#shongoti-product-preview .sg-preview-note{font-size:13px;color:var(--sg-secondary);margin-bottom:10px;max-width:calc(100% - 90px)}
#shongoti-product-preview .sg-product{background:var(--sg-bg);border:1px solid var(--sg-border);border-radius:18px;overflow:clip}
#shongoti-product-preview .sg-top{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:18px 22px;background:var(--sg-surface);border-bottom:1px solid var(--sg-border);flex-wrap:wrap}
#shongoti-product-preview .sg-brand{border:0;background:transparent;padding:0;display:flex;align-items:center;gap:10px;text-align:left;font-weight:600;font-size:20px}
#shongoti-product-preview .sg-brand small{display:block;color:var(--sg-secondary);font-weight:400;font-size:12px}
#shongoti-product-preview .sg-symbol{display:grid;place-items:center;width:38px;height:38px;background:var(--sg-accent);color:var(--sg-on-accent);border-radius:11px;font-size:25px}
#shongoti-product-preview .sg-top-actions,#shongoti-product-preview .sg-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#shongoti-product-preview .sg-button{border:1px solid var(--sg-border);padding:8px 13px;border-radius:9px;background:var(--sg-surface);font-size:14px;min-height:40px;text-align:center}
#shongoti-product-preview .sg-button:disabled{opacity:.55;cursor:not-allowed}
#shongoti-product-preview .sg-primary{background:var(--sg-accent);color:var(--sg-on-accent);border-color:var(--sg-accent)}
#shongoti-product-preview .sg-quiet{background:transparent}
#shongoti-product-preview #sg-layout.sg-app-layout{display:grid;grid-template-columns:168px minmax(0,1fr)}
#shongoti-product-preview #sg-nav{padding:14px 10px;background:var(--sg-surface);border-right:1px solid var(--sg-border)}
#shongoti-product-preview .sg-nav-title{font-size:12px;color:var(--sg-secondary);padding:10px 8px}
#shongoti-product-preview .sg-nav-button{display:flex;gap:8px;align-items:center;background:transparent;border:0;border-radius:8px;width:100%;text-align:left;padding:9px 10px;margin-bottom:3px;font-size:14px}
#shongoti-product-preview .sg-nav-button[aria-current="page"]{background:var(--sg-soft);color:var(--sg-accent);font-weight:600}
#shongoti-product-preview .sg-nav-button svg{width:16px;height:16px;flex-shrink:0}
#shongoti-product-preview #sg-content{min-width:0;padding:26px}
#shongoti-product-preview .sg-stack{display:grid;gap:18px}
#shongoti-product-preview .sg-gap{margin-top:18px}
#shongoti-product-preview .sg-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
#shongoti-product-preview .sg-eyebrow{font-size:13px;color:var(--sg-accent);font-weight:600;margin-bottom:5px}
#shongoti-product-preview .sg-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;padding:24px 4px 32px}
#shongoti-product-preview .sg-hero p{margin:16px 0 20px;color:var(--sg-secondary);max-width:42ch}
#shongoti-product-preview .sg-hero-card{padding:23px;background:var(--sg-surface);border:1px solid var(--sg-border);border-radius:16px;display:grid;gap:16px}
#shongoti-product-preview .sg-panel{background:var(--sg-surface);border:1px solid var(--sg-border);border-radius:12px;padding:18px;min-width:0}
#shongoti-product-preview .sg-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#shongoti-product-preview .sg-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#shongoti-product-preview .sg-stat .sg-label{color:var(--sg-secondary);font-size:13px}
#shongoti-product-preview .sg-value{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.5}
#shongoti-product-preview .sg-pill{display:inline-block;padding:3px 8px;border-radius:6px;font-size:12px;background:var(--sg-soft);color:var(--sg-accent);width:fit-content}
#shongoti-product-preview .sg-risk{color:var(--sg-risk)}
#shongoti-product-preview .sg-warning{background:var(--sg-risk-bg);border-left:3px solid var(--sg-risk);padding:12px 14px;border-radius:5px;font-size:14px}
#shongoti-product-preview .sg-info{background:var(--sg-soft);padding:12px 14px;border-radius:8px;font-size:14px}
#shongoti-product-preview .sg-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--sg-border);flex-wrap:wrap}
#shongoti-product-preview .sg-row:last-child{border-bottom:0;padding-bottom:0}
#shongoti-product-preview .sg-row:first-child{padding-top:0}
#shongoti-product-preview .sg-row>div{min-width:0}
#shongoti-product-preview .sg-task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
#shongoti-product-preview .sg-form{display:grid;gap:15px;max-width:580px}
#shongoti-product-preview label{display:grid;gap:6px;font-size:14px}
#shongoti-product-preview input:not([type="checkbox"]),#shongoti-product-preview select,#shongoti-product-preview textarea{width:100%;min-width:0;padding:10px 11px;border:1px solid var(--sg-border);border-radius:8px;background:var(--sg-surface);color:var(--sg-text);font-size:16px}
#shongoti-product-preview input[type="range"]{padding:0;accent-color:var(--sg-accent)}
#shongoti-product-preview input[type="checkbox"]{width:18px;height:18px;accent-color:var(--sg-accent)}
#shongoti-product-preview .sg-check{display:flex;gap:9px;align-items:center}
#shongoti-product-preview .sg-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}
#shongoti-product-preview .sg-table th{text-align:left;color:var(--sg-secondary);font-weight:400;font-size:13px}
#shongoti-product-preview .sg-table th,#shongoti-product-preview .sg-table td{padding:11px 6px;border-bottom:1px solid var(--sg-border);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
#shongoti-product-preview .sg-table td:not(:first-child),#shongoti-product-preview .sg-table th:not(:first-child){text-align:right}
#shongoti-product-preview .sg-day-risk{background:var(--sg-risk-bg)}
#shongoti-product-preview .sg-flow{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--sg-secondary)}
#shongoti-product-preview .sg-flow span{border-bottom:2px solid var(--sg-border);padding:4px 0;flex:1;min-width:95px}
#shongoti-product-preview .sg-flow .sg-flow-active{color:var(--sg-accent);border-color:var(--sg-accent)}
#shongoti-product-preview .sg-message{padding:14px 22px;border-top:1px solid var(--sg-border);background:var(--sg-soft);font-size:14px}
#shongoti-product-preview details{border-top:1px solid var(--sg-border);padding-top:12px;margin-top:12px;font-size:14px}
#shongoti-product-preview summary{color:var(--sg-accent)}
#shongoti-product-preview .sg-number{font-variant-numeric:tabular-nums;white-space:nowrap}
#shongoti-product-preview .sg-auth{max-width:560px;margin:12px auto 30px}
#shongoti-product-preview .sg-steps{display:grid;gap:8px;color:var(--sg-secondary);font-size:14px}
#shongoti-product-preview .sg-connector{display:grid;gap:10px;align-content:start}
@media(max-width:800px){#shongoti-product-preview #sg-layout.sg-app-layout{grid-template-columns:minmax(0,1fr)}#shongoti-product-preview #sg-nav{display:flex;flex-wrap:wrap;gap:4px;border-right:0;border-bottom:1px solid var(--sg-border);padding:10px}#shongoti-product-preview .sg-nav-title{display:none}#shongoti-product-preview .sg-nav-button{width:auto;margin:0;padding:7px 9px;font-size:13px}#shongoti-product-preview #sg-content{padding:20px}#shongoti-product-preview .sg-nav-button svg{display:none}}
@media(max-width:560px){#shongoti-product-preview .sg-hero,#shongoti-product-preview .sg-grid-2,#shongoti-product-preview .sg-grid-3{grid-template-columns:minmax(0,1fr)}#shongoti-product-preview .sg-top{padding:15px}#shongoti-product-preview #sg-content{padding:15px}#shongoti-product-preview .sg-panel{padding:14px}#shongoti-product-preview .sg-task{grid-template-columns:minmax(0,1fr)}#shongoti-product-preview .sg-value{font-size:25px}#shongoti-product-preview .sg-top-actions{gap:6px}#shongoti-product-preview .sg-top-actions .sg-quiet{display:none}#shongoti-product-preview .sg-hero{padding-top:12px;gap:18px}#shongoti-product-preview .sg-table{font-size:13px}#shongoti-product-preview .sg-table th,#shongoti-product-preview .sg-table td{padding:9px 4px}#shongoti-product-preview .sg-preview-note{max-width:100%}}
@media(pointer:coarse){#shongoti-product-preview button{min-height:44px}}
</style>
<script>
(() => {
  const root = document.getElementById('shongoti-product-preview');
  const main = root.querySelector('#sg-content');
  const nav = root.querySelector('#sg-nav');
  const layout = root.querySelector('#sg-layout');
  const message = root.querySelector('#sg-message');
  const allowed = ['landing','login','setup','home','forecast','money','sales','people','reconcile','inventory','inbox','actions','integrations','reports','team'];
  const state = {view:'landing', expense:6000, daily:1000, promise:false, cash:12000, bkash:2000, nagad:5000, deduction:'unknown', density:'আরামদায়ক'};
  const titles = {home:'আজকের ব্যবসা',forecast:'ভবিষ্যৎ ও সিদ্ধান্ত',money:'টাকা ও লেনদেন',sales:'বিক্রি ও বিল',people:'কাস্টমার ও সাপ্লায়ার',reconcile:'বিল যাচাই',inventory:'স্টক ও কেনাকাটা',inbox:'কাগজ ও ভয়েস',actions:'করণীয় ও অনুমোদন',integrations:'সংযুক্ত সেবা',reports:'রিপোর্ট',team:'টিম ও নিয়ন্ত্রণ'};
  const icons = {home:'layout-dashboard',forecast:'git-branch',money:'wallet',sales:'receipt',people:'users',reconcile:'scan-line',inventory:'package',inbox:'inbox',actions:'list-checks',integrations:'plug',reports:'chart-no-axes-combined',team:'shield-check'};
  const bn = new Intl.NumberFormat('bn-BD');
  const money = n => '৳' + bn.format(n);
  const button = (label,view,primary=false) => `<button class="sg-button ${primary?'sg-primary':''} cursor-interaction" data-view="${view}">${label}</button>`;
  const head = (title,sub,actions='') => `<div class="sg-heading"><div><div class="sg-eyebrow">রহমান স্টোর · নমুনা</div><h2>${title}</h2><p class="sg-muted sg-small">${sub}</p></div>${actions}</div>`;
  function model(expense=state.expense,daily=state.daily,promise=state.promise,cash=state.cash){
    const outflows=[2000,0,6000,0,4000,0,3000];
    const events=['চলতি খরচ','নির্ধারিত বড় খরচ নেই','সাপ্লায়ার · ৬,০০০','নির্ধারিত বড় খরচ নেই','পুনরায় স্টক · ৪,০০০','নির্ধারিত বড় খরচ নেই','ভাড়া · ৩,০০০'];
    let baseline=cash,changed=cash;
    return outflows.map((out,i)=>{
      baseline+=daily-out;
      changed+=daily-out-(i===0?expense:0)+(promise&&i===1?3000:0);
      return {date:`${bn.format(22+i)} নভে`,baseline,changed,event:events[i]};
    });
  }
  function save(){
    if(window.openai&&window.openai.setWidgetState)window.openai.setWidgetState({modelContent:{screen:state.view,extraExpenseBDT:state.expense,dailyCashSalesAssumptionBDT:state.daily,includeConditionalPromise:state.promise},privateContent:null}).catch(()=>{});
  }
  function notify(text){message.textContent=text;message.hidden=false;}
  function journey(active){return `<div class="sg-flow" aria-label="পণ্যে প্রবেশের ধাপ">${['ল্যান্ডিং','প্রবেশ','দোকান সেটআপ','ড্যাশবোর্ড'].map((x,i)=>`<span class="${i===active?'sg-flow-active':''}">${x}</span>`).join('')}</div>`;}
  function landing(){return `<div class="sg-stack">${journey(0)}<div class="sg-hero"><div><div class="sg-eyebrow">দোকানের প্রতিটি টাকার পরের ধাপ</div><h1>আজ খরচের আগে,<br>আগামীকালের প্রভাব দেখুন।</h1><p>বিক্রি, বাকি, সাপ্লায়ারের বিল ও মালের টাকা একসঙ্গে দেখুন। বাংলায় বলুন, প্রমাণ যাচাই করুন, তারপর সিদ্ধান্ত নিন।</p><div class="sg-actions">${button('আমার দোকান শুরু করি','login',true)}${button('খরচের প্রভাব পরীক্ষা','forecast')}</div></div><div class="sg-hero-card"><div class="sg-heading"><h3>খরচের আগে একবার দেখুন</h3><span class="sg-pill">নমুনা</span></div><div><div class="sg-small sg-muted">আজ অতিরিক্ত খরচ</div><div class="sg-value">৬,০০০ টাকা</div></div><div class="sg-warning">এই অনুমানে ২৪ নভেম্বর reserve কমবে; ২৬ নভেম্বর স্টকের টাকা কম পড়বে।</div>${button('বিকল্প সিদ্ধান্ত দেখি','forecast',true)}</div></div><div class="sg-grid-3"><div class="sg-panel"><h3>হিসাব সহজে যোগ</h3><p class="sg-small sg-muted">বিলের ছবি, PDF অথবা ছোট বাংলা voice note।</p></div><div class="sg-panel"><h3>সঠিক পাওনা যাচাই</h3><p class="sg-small sg-muted">আগের পেমেন্ট ও ফেরতের টাকা ইতিমধ্যে ধরা আছে কি না দেখুন।</p></div><div class="sg-panel"><h3>করণীয় সম্পূর্ণ করুন</h3><p class="sg-small sg-muted">বিল তৈরি, আদায়ের অনুরোধ প্রস্তুত ও payment status এক জায়গায়।</p></div></div></div>`;}
  function login(){return `<div class="sg-stack">${journey(1)}<div class="sg-panel sg-auth sg-stack"><div><div class="sg-eyebrow">স্বাগতম</div><h2>আপনার দোকানে প্রবেশ করুন</h2></div><label>মোবাইল নম্বর<input type="tel" placeholder="01XXXXXXXXX" autocomplete="off" aria-label="নমুনা মোবাইল নম্বর"></label><p class="sg-small sg-muted">সম্পূর্ণ পণ্যে OTP দিয়ে যাচাই হবে। এখানে কোনো OTP বা login request পাঠানো হবে না।</p>${button('ডেমো হিসেবে প্রবেশ','setup',true)}${button('আগে ড্যাশবোর্ড দেখি','home')}</div></div>`;}
  function setup(){return `<div class="sg-stack">${journey(2)}${head('দোকান প্রস্তুত করুন','একটি balance snapshot দিয়েই শুরু; পুরোনো সব হিসাব যোগ করা প্রয়োজন নেই।')}<div class="sg-form"><label>দোকানের নাম<input value="রহমান স্টোর" aria-label="দোকানের নমুনা নাম"></label><div class="sg-grid-3"><label>Cash<input id="sg-cash" type="number" min="0" max="1000000" value="${state.cash}"></label><label>bKash<input id="sg-bkash" type="number" min="0" max="1000000" value="${state.bkash}"></label><label>Nagad<input id="sg-nagad" type="number" min="0" max="1000000" value="${state.nagad}"></label></div><div class="sg-info">প্রথম কাজ: cash snapshot, জরুরি পাওনা এবং reserve। পুরোনো bill বা CSV পরে যোগ করা যাবে।</div><button id="sg-start" class="sg-button sg-primary cursor-interaction">নমুনা দোকান প্রস্তুত</button></div></div>`;}

  function projection(){

    root.querySelector('#sg-projection').innerHTML=`<div class="sg-grid-3"><div class="sg-panel sg-stat"><div class="sg-label">৭ দিনের সর্বনিম্ন cash</div><div class="sg-value ${minimum<0?'sg-risk':''}">${money(minimum)}</div></div><div class="sg-panel sg-stat"><div class="sg-label">Reserve কমার প্রথম দিন</div><div class="sg-value">${breach?breach.date:'কমছে না'}</div></div><div class="sg-panel sg-stat"><div class="sg-label">প্রথম সরাসরি টাকার ঘাটতি</div><div class="sg-value">${negative?negative.date:'নেই'}</div></div></div><div class="${breach?'sg-warning':'sg-info'}">${breach?`${breach.date}: ${breach.event}। Reserve লক্ষ্য থেকে ${money(3000-breach.changed)} কম থাকবে।`:'এই অনুমানে ৭ দিনের প্রতিটি cutoff-এ reserve বজায় থাকে। অনুমান বদলালে ফলও বদলাবে।'}</div><section class="sg-panel"><table class="sg-table"><thead><tr><th>দিন / জানা খরচ</th><th>আগের পরিকল্পনা</th><th>এই সিদ্ধান্তে</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.changed<3000?'sg-day-risk':''}"><td>${r.date}<small class="sg-muted" style="display:block">${r.event}</small></td><td>${money(r.baseline)}</td><td>${money(r.changed)}${r.changed<0?'<small style="display:block">ঘাটতি</small>':''}</td></tr>`).join('')}</tbody></table></section><div class="sg-actions"><button class="sg-button sg-primary cursor-interaction" id="sg-smaller">১,০০০ টাকা খরচ পরীক্ষা</button>${button('করণীয় প্রস্তুত করি','actions')}</div>`;
  }

  function reconciliationResult(){root.querySelector('#sg-reconcile-result').textContent=state.deduction==='yes'?'এই উত্তরের ভিত্তিতে payable ৳২২,০০০। মূল source ও অনুমোদন ছাড়া ledger বদলাবে না।':state.deduction==='no'?'এই উত্তরের ভিত্তিতে payable ৳১৮,০০০। মূল source ও অনুমোদন ছাড়া ledger বদলাবে না।':'দুটি সম্ভাবনা: ৳২২,০০০ অথবা ৳১৮,০০০। নির্দিষ্ট প্রশ্নের পরিষ্কার উত্তর প্রয়োজন।';}
  function inventory(){return `<div class="sg-stack">${head('স্টক ও কেনাকাটা','Stock cover, supplier lead time এবং cash impact একসঙ্গে দেখুন।')}<section class="sg-panel"><div class="sg-row"><div><h3>সয়াবিন তেল</h3><small class="sg-muted">নমুনা stock ২৪ লিটার · অনুমান ৮ লিটার/দিন</small></div><span class="sg-pill">প্রায় ৩ দিনের cover</span></div><div class="sg-row"><div>চাল<small class="sg-muted" style="display:block">নমুনা stock ৬০ কেজি · sales history যাচাই বাকি</small></div><span class="sg-muted">Prediction নেই</span></div></section><div class="sg-grid-2"><section class="sg-panel sg-stack"><h3>Reorder প্রস্তুত</h3><p class="sg-small sg-muted">প্রয়োজনীয় পরিমাণ, supplier lead time, price ও budget দিয়ে purchase draft। অনুমানকে actual stock দেখানো হবে না।</p>${button('কেনার আগে টাকার প্রভাব','forecast',true)}</section><section class="sg-panel sg-stack"><h3>ফেরত ও credit</h3><p class="sg-small sg-muted">কোন ফেরত সাপ্লায়ার মেনেছেন, কোন credit বিলে ধরা হয়েছে এবং কোনটি বাকি—এক জায়গায়।</p>${button('Credit যাচাই','reconcile')}</section></div></div>`;}
  function inbox(){return `<div class="sg-stack">${head('কাগজ ও ভয়েস থেকে হিসাব','প্রথমে source, তারপর proposed facts, তারপর আপনার review।')}<div class="sg-grid-3"><div class="sg-panel sg-stack"><h3>বিল / PDF</h3><p class="sg-small sg-muted">Invoice, statement, return slip</p><button class="sg-button cursor-interaction" data-note="সম্পূর্ণ পণ্যে file upload ও parser চলবে। এই preview-তে নমুনা extraction দেখানো হচ্ছে; কোনো file পাঠানো হচ্ছে না।">নমুনা extraction দেখি</button></div><div class="sg-panel sg-stack"><h3>ছবি</h3><p class="sg-small sg-muted">রসিদ, challan, handwritten note</p>${button('Source review দেখি','reconcile')}</div><div class="sg-panel sg-stack"><h3>বাংলায় বলুন</h3><p class="sg-small sg-muted">“রহিম পাঁচশো দিল, আগের বাকি থেকে”</p><button class="sg-button cursor-interaction" data-note="Proposed receipt: রহিম ৳৫০০ দিয়েছে। কোন মাধ্যমে এবং কোন বাকি থেকে—নিশ্চিত না হলে প্রশ্ন আসবে। এই preview microphone চালু করে না।">Review-এর নমুনা</button></div></div><section class="sg-panel sg-stack"><h3>Review queue</h3><div class="sg-row"><div>Invoice 41<small class="sg-muted" style="display:block">অঙ্ক পাওয়া গেছে · inclusion প্রশ্ন বাকি</small></div>${button('খুলি','reconcile')}</div><div class="sg-row"><div>করিমের কথা<small class="sg-muted" style="display:block">আংশিক promise · cash/Nagad অস্পষ্ট</small></div>${button('খুলি','people')}</div></section></div>`;}
  function actions(){return `<div class="sg-stack">${head('করণীয় ও অনুমোদন','পরিকল্পনা → খসড়া → অনুমোদন → provider status → actual হিসাব।')}<section class="sg-panel sg-stack"><h3>আজকের খরচের বিকল্প</h3><p class="sg-small sg-muted">বর্তমান scenario: অতিরিক্ত ${money(state.expense)} cash খরচ। ছোট খরচের ফল আগে তুলনা করা যায়।</p>${button('বিকল্প পরীক্ষা','forecast',true)}</section><section class="sg-panel sg-stack"><div class="sg-heading"><h3>করিমের promise নিশ্চিত করুন</h3><span class="sg-pill">খসড়া · পাঠানো হয়নি</span></div><label>সম্পাদনাযোগ্য প্রশ্ন<textarea rows="3">ভাই, আগের বাকি থেকে যে এক হাজার টাকা দেওয়ার কথা বলেছেন, সেটি cash-এ দেবেন নাকি Nagad-এ? কখন পাওয়া যাবে জানাবেন?</textarea></label><div class="sg-actions"><button class="sg-button sg-primary cursor-interaction" data-note="খসড়াটি এই preview-তে প্রস্তুত রাখা হয়েছে। কোনো customer-কে message পাঠানো হয়নি।">খসড়া প্রস্তুত রাখি</button>${button('যোগাযোগের সেবা দেখি','integrations')}</div></section><section class="sg-panel"><h3>যা অনুমোদন ছাড়া হবে না</h3><p class="sg-small sg-muted">বাইরে message পাঠানো, order confirm, payment initiate এবং actual ledger posting। নতুন তথ্য এলে পুরোনো approval আবার যাচাই হবে।</p></section></div>`;}
  function integrations(){return `<div class="sg-stack">${head('সংযুক্ত সেবা','সত্যিকারের status: সংযুক্ত নয় / sandbox / live / ত্রুটি।')}<div class="sg-grid-2"><section class="sg-panel sg-connector"><h3>SSLCOMMERZ</h3><span class="sg-pill">সেটআপ প্রয়োজন</span><p class="sg-small sg-muted">Customer checkout, validated notification, payment status ও receipt matching।</p><button class="sg-button cursor-interaction" data-note="সেটআপ: sandbox merchant credentials, server-side session, IPN listener, validation এবং amount/currency matching। Live collection-এর জন্য merchant approval দরকার।">কী লাগবে দেখি</button></section><section class="sg-panel sg-connector"><h3>Google Sheets</h3><span class="sg-pill">সংযুক্ত নয়</span><p class="sg-small sg-muted">নির্বাচিত sheet import, preview, deduplicate এবং report export।</p><button class="sg-button cursor-interaction" data-note="সম্পূর্ণ পণ্যে OAuth ও নির্দিষ্ট file access লাগবে। এই preview কোনো Google account access চায় না।">সেটআপের তথ্য</button></section><section class="sg-panel sg-connector"><h3>ইনভয়েস ও যোগাযোগ</h3><span class="sg-pill">Provider যাচাই বাকি</span><p class="sg-small sg-muted">অনুমোদিত transactional use case, recipient permission এবং delivery status।</p><button class="sg-button cursor-interaction" data-note="WhatsApp policy-তে debt collection নিষিদ্ধ। অনুমোদিত invoice/order messaging-ও provider policy যাচাই ছাড়া চালু হবে না; এই preview কিছু পাঠায় না।">ব্যবহারের সীমা</button></section><section class="sg-panel sg-connector"><h3>bKash / Nagad / Bank</h3><span class="sg-pill">Statement / manual snapshot</span><p class="sg-small sg-muted">Gateway payment status এবং ব্যক্তিগত wallet balance access ভিন্ন capability।</p><button class="sg-button cursor-interaction" data-note="স্বয়ংক্রিয় সব wallet balance পড়া বা supplier-কে টাকা পাঠানোর অনুমতি এখানে নেই। অনুমোদিত API capability না পাওয়া পর্যন্ত statement/import ও reviewed entry থাকবে।">উপলব্ধ capability</button></section></div></div>`;}
  function reports(){return `<div class="sg-stack">${head('ব্যবসার রিপোর্ট','Cash, profit, stock এবং বাকি আলাদা মাপে দেখুন।')}<div class="sg-grid-2"><section class="sg-panel sg-stack"><h3>Cash বনাম লাভ</h3><p class="sg-small sg-muted">বাকি বিক্রি হলে revenue হতে পারে, কিন্তু cash আসে না। পুরোনো বাকি আদায় cash বাড়ায়, নতুন sales নয়।</p><span class="sg-pill">Cost data ছাড়া নির্ভরযোগ্য profit দেখাব না</span></section><section class="sg-panel sg-stack"><h3>টাকা কোথায় আটকে?</h3><p class="sg-small sg-muted">Customer dues, inventory, supplier credit এবং owner withdrawal-এর পৃথক breakdown।</p>${button('হিসাবের source দেখি','money')}</section></div><section class="sg-panel sg-stack"><h3>মাসের report ও export</h3><p class="sg-small sg-muted">Sales, expenses, receivables/payables, cash movement এবং যাচাই বাকি থাকা রেকর্ড।</p><button class="sg-button cursor-interaction" data-note="সম্পূর্ণ পণ্যে প্রকৃত reviewed ledger থেকে PDF/CSV report তৈরি হবে। এই preview থেকে কোনো fabricated financial statement export করা হচ্ছে না।">Export-এর নমুনা flow</button></section></div>`;}
  function team(){return `<div class="sg-stack">${head('টিম ও নিয়ন্ত্রণ','Owner, cashier এবং accountant-এর কাজ অনুযায়ী access।')}<section class="sg-panel"><div class="sg-row"><div>Owner<small class="sg-muted" style="display:block">খরচ, payment, order ও গুরুত্বপূর্ণ correction অনুমোদন</small></div><span class="sg-pill">সম্পূর্ণ নিয়ন্ত্রণ</span></div><div class="sg-row"><div>Cashier<small class="sg-muted" style="display:block">Sales ও receipt entry; approval limit-এর বাইরে draft</small></div><span>সীমিত কাজ</span></div><div class="sg-row"><div>Accountant<small class="sg-muted" style="display:block">Review, correction proposal ও report</small></div><span>হিসাব review</span></div></section><div class="sg-info">প্রতিটি পরিবর্তনে কে, কখন, কোন source ও কোন version অনুমোদন করেছেন—দেখা যাবে।</div></div>`;}
  const views={landing,login,setup,home,forecast,money:moneyView,sales,people,reconcile,inventory,inbox,actions,integrations,reports,team};
  function render(){
    if(!allowed.includes(state.view))state.view='landing';
    const inside=!['landing','login','setup'].includes(state.view);
    layout.classList.toggle('sg-app-layout',inside);nav.hidden=!inside;message.hidden=true;
    nav.innerHTML=`<div class="sg-nav-title">রহমান স্টোর · OWNER</div>`+Object.keys(titles).map(v=>`<button class="sg-nav-button cursor-interaction" data-view="${v}" ${state.view===v?'aria-current="page"':''}><i data-lucide="${icons[v]}" aria-hidden="true"></i>${titles[v]}</button>`).join('');
    main.innerHTML=views[state.view]();
    if(state.view==='forecast')projection();if(state.view==='reconcile')reconciliationResult();
    if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});
  }
  root.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target)return;
    if(target.dataset.view){state.view=target.dataset.view;render();save();return;}
    if(target.dataset.note){notify(target.dataset.note);return;}
    if(target.id==='sg-smaller'){state.expense=1000;state.promise=false;root.querySelector('#sg-expense').value='1000';root.querySelector('#sg-promise').checked=false;projection();save();}
    if(target.id==='sg-start'){
      const values=['cash','bkash','nagad'].map(k=>Number(root.querySelector('#sg-'+k).value));
      if(values.some(v=>!Number.isFinite(v)||v<0||v>1000000)){notify('০ থেকে ১০,০০,০০০-এর মধ্যে balance দিন।');return;}
      [state.cash,state.bkash,state.nagad]=values;state.view='home';render();save();
    }
  });
  root.addEventListener('input',event=>{if(event.target.id==='sg-expense'){state.expense=Number(event.target.value);projection();save();}});
  root.addEventListener('change',event=>{
    if(event.target.id==='sg-daily'){state.daily=Number(event.target.value);projection();save();}
    if(event.target.id==='sg-promise'){state.promise=event.target.checked;projection();save();}
    if(event.target.id==='sg-deduction'){state.deduction=event.target.value;reconciliationResult();}
  });
  function restore(saved){
    const v=saved&&saved.modelContent;
    if(!v)return;
    if(allowed.includes(v.screen))state.view=v.screen;
    if(Number.isFinite(v.extraExpenseBDT))state.expense=Math.max(0,Math.min(10000,v.extraExpenseBDT));
    if([700,1000,1300].includes(v.dailyCashSalesAssumptionBDT))state.daily=v.dailyCashSalesAssumptionBDT;
    if(typeof v.includeConditionalPromise==='boolean')state.promise=v.includeConditionalPromise;
  }
  if(window.openai)restore(window.openai.widgetState);
  window.addEventListener('openai:set_globals',event=>{const globals=event.detail&&event.detail.globals;if(globals&&globals.widgetState){restore(globals.widgetState);render();}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{root.style.fontSize=state.density==='ঘন'?'15px':'16px';}});tweak.addSelect(state,'density',{label:'পর্দার ঘনত্ব',options:['আরামদায়ক','ঘন']});}
})();
</script>
